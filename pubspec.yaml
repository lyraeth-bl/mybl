name: my_bl
description: "A Budi Luhur App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  dio: ^5.9.2
  fpdart: ^1.2.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
  go_router: ^17.2.2
  hive_ce: ^2.19.3
  flutter_secure_storage: ^10.0.0
  hive_ce_flutter: ^2.3.4
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  table_calendar: ^3.2.0
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  qr: ^4.0.0
  package_info_plus: ^10.1.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  awesome_notifications: ^0.11.0
  firebase_core: ^4.9.0
  timeago: ^3.7.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.14.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  hive_ce_generator: ^1.11.1
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/bl_logo.png
  android: true
  ios: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/bl_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/bl_logo.png"