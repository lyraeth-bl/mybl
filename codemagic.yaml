workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --dart-define=BASE_URL=https://laravel.jh-beon.cloud/api_spo_sanctum/public \
            --dart-define=BASE_URL_INTERNAL=https://sekolahbudiluhur.sch.id/internal/dc_dispo_ok \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - farhan@budiluhur.sch.id
